name: "🚨 Incident Report"
description: "Use this form to report a new incident (production outages, security incidents, etc.)."
title: "[Incident]"
labels: ["incident", "triage-needed"]
body:
  - type: markdown
    attributes:
      value: |
        **Thanks for reporting an incident!**  
        Please fill out all required fields (marked with *) so the support team can triage quickly.  
        If unsure, add as much detail as possible — it helps resolve issues faster!  

  - type: input
    id: short_summary
    attributes:
      label: "📝 Short summary *"
      description: "One-line summary of the incident (e.g., 'Login service outage')"
      placeholder: "Login service outage"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "⚠️ Severity level *"
      description: "Select how critical this incident is"
      options:
        - label: "P1 - Critical"
          value: "P1"
        - label: "P2 - High"
          value: "P2"
        - label: "P3 - Medium"
          value: "P3"
        - label: "P4 - Low"
          value: "P4"
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: "🌐 Impact *"
      description: "Who/what is affected and the scope/scale (participants, contractors, admins/admin managers, etc.)"
      placeholder: "E.g., participants cannot submit applications"
    validations:
      required: true

  - type: input
    id: timeline
    attributes:
      label: "⏰ Timeline / Detection"
      description: "When did this start? When was it detected? Use format YYYY-MM-DD HH:MM"
      placeholder: "e.g., 2025-09-22 10:30"

  - type: textarea
    id: actions_taken
    attributes:
      label: "🛠️ Actions taken so far"
      description: "What has been tried, who was contacted, and any temporary mitigations"
      placeholder: "E.g., restarted service, escalated to on-call"

  - type: input
    id: contact
    attributes:
      label: "📞 Point of contact *"
      description: "Name / email / Slack handle"
      placeholder: "Jane Doe / @jdoe / jdoe@example.com"
    validations:
      required: true

  - type: dropdown
    id: security_related
    attributes:
      label: "🔒 Security-related incident?"
      description: "Select if this incident involves security concerns"
      options:
        - "Yes"
        - "No"
      default: 1
